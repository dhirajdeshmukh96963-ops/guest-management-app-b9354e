name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web Application
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Detect Build Directory and Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          
          # Auto-detect build folder (dist, build, or out)
          BUILD_DIR="dist"
          if [ -d "build" ]; then
            BUILD_DIR="build"
          elif [ -d "out" ]; then
            BUILD_DIR="out"
          fi
          echo "Detected web build directory: $BUILD_DIR"
          
          npx cap init "Guest Management" "com.guest.app" --web-dir "$BUILD_DIR"
          npx cap add android
          npx cap copy

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guest-Management-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
