# Build Android APK (uses pnpm, Node, JDK17, Gradle)
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Common Android SDK env var; the hosted runner already provides an SDK, but we set this for gradle to find it
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8' # change to the pnpm major you need

      - name: Install Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          # Cache Gradle directories to speed up builds. Key includes OS and Gradle wrapper checksum if present.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies (pnpm)
        working-directory: .
        run: |
          # Use a deterministic install; DO NOT pass incorrect flags like --yes
          pnpm install --frozen-lockfile

      - name: Ensure Android SDK components and accept licenses
        # The hosted runner includes Android SDK tools. Use sdkmanager to ensure required platform/build-tools are installed.
        run: |
          set -e
          # Print sdkmanager location for debugging if needed
          which sdkmanager || true
          sdkmanager --version || true

          # Accept all SDK licenses (yes piped to sdkmanager --licenses)
          yes | sdkmanager --licenses

          # Install platform-tools, chosen platform and build-tools. Adjust APIs/versions as needed.
          yes | sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      - name: Build Android release APK
        working-directory: android
        run: |
          set -e
          # Ensure gradlew is executable
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
