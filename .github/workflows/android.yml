name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web Application
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Locate Build Output & Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

          # Find where index.html was built
          BUILD_PATH=$(find . -maxdepth 3 -name "index.html" -not -path "*/node_modules/*" -not -path "./index.html" -not -path "./public/*" | head -n 1 | xargs dirname)

          if [ -z "$BUILD_PATH" ]; then
            echo "No build folder found, defaulting to current root"
            BUILD_PATH="."
          fi

          echo "Found compiled app at: $BUILD_PATH"

          # Prepare static dist folder for Capacitor
          mkdir -p capacitor_dist
          cp -r $BUILD_PATH/* capacitor_dist/

          npx cap init "Guest Management" "com.guest.app" --web-dir "capacitor_dist"
          npx cap add android
          npx cap copy

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guest-Management-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
